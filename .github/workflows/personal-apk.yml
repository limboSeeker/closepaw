name: Personal signed APK
on:
  push:
    branches: [fix/chatgpt-oauth-android]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: personal-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode private signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/closepaw-release.p12"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --stacktrace
      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/closepaw-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: closepaw
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease -PVERSION_NAME=0.1.1-chatgpt -PVERSION_CODE=2 --no-daemon --max-workers=2 --stacktrace
      - name: Verify APK signature and ZIP page alignment
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ClosePaw-ChatGPT-signed.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/ClosePaw-ChatGPT-signed.apk | tee dist/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 dist/ClosePaw-ChatGPT-signed.apk > dist/zipalign.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/ClosePaw-ChatGPT-signed.apk > dist/apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree dist/ClosePaw-ChatGPT-signed.apk AndroidManifest.xml > dist/manifest.txt
          sha256sum dist/ClosePaw-ChatGPT-signed.apk > dist/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > dist/source-commit.txt
      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ClosePaw-ChatGPT-signed
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/closepaw-release.p12"
